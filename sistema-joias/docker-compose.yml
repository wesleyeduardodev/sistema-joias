services:
  postgres:
    image: postgres:18
    container_name: joias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sistema_joias
      POSTGRES_USER: joias_user
      POSTGRES_PASSWORD: joias_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
