<!DOCTYPE html>

<html class="h-full" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JoiasGestor - Criar Conta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "error-container": "#ffdad6",
                "on-primary": "#ffffff",
                "on-error-container": "#93000a",
                "on-tertiary-fixed-variant": "#524620",
                "on-tertiary": "#ffffff",
                "on-secondary-fixed-variant": "#584400",
                "inverse-surface": "#2f3131",
                "on-secondary-container": "#785d00",
                "surface-variant": "#e2e2e2",
                "primary-container": "#adabab",
                "on-primary-fixed-variant": "#474746",
                "error": "#ba1a1a",
                "tertiary-container": "#bbaa7b",
                "on-error": "#ffffff",
                "secondary": "#755b00",
                "primary-fixed": "#e5e2e1",
                "outline-variant": "#d0c5b2",
                "primary-fixed-dim": "#c8c6c5",
                "surface-tint": "#5f5e5e",
                "on-background": "#1a1c1c",
                "on-secondary-fixed": "#241a00",
                "inverse-on-surface": "#f0f1f1",
                "background": "#f9f9f9",
                "tertiary": "#6b5d35",
                "outline": "#7e7665",
                "on-secondary": "#ffffff",
                "on-primary-container": "#40403f",
                "surface-container-highest": "#e2e2e2",
                "surface-container-low": "#f3f3f3",
                "tertiary-fixed": "#f5e1ae",
                "surface-bright": "#f9f9f9",
                "on-tertiary-fixed": "#231b00",
                "surface-dim": "#dadada",
                "surface-container": "#eeeeee",
                "primary": "#5f5e5e",
                "secondary-container": "#fed977",
                "on-surface": "#1a1c1c",
                "surface": "#f9f9f9",
                "on-tertiary-container": "#4a3f19",
                "surface-container-lowest": "#ffffff",
                "on-primary-fixed": "#1c1b1b",
                "tertiary-fixed-dim": "#d8c594",
                "on-surface-variant": "#4d4637",
                "secondary-fixed": "#ffe08f",
                "secondary-fixed-dim": "#e6c364",
                "surface-container-high": "#e8e8e8",
                "inverse-primary": "#c8c6c5"
              },
              fontFamily: {
                "headline": ["Inter"],
                "body": ["Inter"],
                "label": ["Inter"],
                "mono": ["JetBrains Mono"]
              },
              borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #755B00 0%, #E6C364 100%);
        }
    </style>
</head>
<body class="h-full bg-surface font-body overflow-hidden">
<main class="flex h-full w-full">
<!-- Left Side: Hero Section (60%) -->
<section class="hidden lg:block lg:w-3/5 relative h-full">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Close-up of luxury gold rings and brilliant diamonds displayed on deep black velvet with moody atmospheric lighting and soft shadows" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuABL4JiyLoyrlQ6ZEQfxi2Pr3YgleemEXxSq01gKVQoxxUwws3RUrYHwOEQGYlpYLDrWE9ehVUuABqR0Vr7hphxWhM8CDQGyXl92otrV0jcdtbPBKIAT6LL27gBH_KylXMp-zDfFSplY8WGoEIM77obUCYfhr3ei2cTr5B0Eeo5Sa_qhdjwIoO7Vh_s5oaDqxtSoCZs0fDZMGwmVu3UrHmySYxU2mwZSTRsnetgDVC0ur0ivmSKhx9dH5Le3xietm8YV6D3mVd2vRdb')">
</div>
<!-- Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-[#1A1A1A] via-[#1A1A1A]/40 to-transparent"></div>
<!-- Branding -->
<div class="absolute top-12 left-12 z-10">
<h1 class="text-2xl font-semibold tracking-[0.2em] uppercase text-[#C9A84C]">JoiasGestor</h1>
</div>
<!-- Tagline -->
<div class="absolute bottom-24 left-12 z-10 max-w-lg">
<p class="text-5xl font-medium text-white tracking-tight leading-tight">
                    Gestão inteligente para sua joalheria
                </p>
<div class="mt-6 w-16 h-1 gold-gradient"></div>
</div>
</section>
<!-- Right Side: Registration Form (40%) -->
<section class="w-full lg:w-2/5 h-full bg-surface-container-lowest flex flex-col justify-center items-center px-8 sm:px-12 md:px-20 overflow-y-auto py-12">
<div class="w-full max-w-md">
<!-- Mobile Branding -->
<div class="lg:hidden mb-8">
<h1 class="text-xl font-semibold tracking-widest uppercase text-[#C9A84C]">JoiasGestor</h1>
</div>
<div class="mb-10">
<h2 class="text-3xl font-bold text-on-surface tracking-tight">Criar Conta</h2>
<p class="mt-2 text-on-surface-variant font-normal">Preencha seus dados para solicitar acesso</p>
</div>
<form class="space-y-5">
<!-- Nome Completo -->
<div class="space-y-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1">Nome completo</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-[#C9A84C] transition-colors">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-[6px] focus:ring-2 focus:ring-[#C9A84C] focus:ring-offset-2 transition-all placeholder:text-outline/50" placeholder="Seu nome" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-[#C9A84C] transition-colors">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-[6px] focus:ring-2 focus:ring-[#C9A84C] focus:ring-offset-2 transition-all placeholder:text-outline/50" placeholder="exemplo@joalheria.com" type="email"/>
</div>
</div>
<!-- Grid for CPF and Telefone -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- CPF -->
<div class="space-y-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1">CPF</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-[#C9A84C] transition-colors">badge</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-[6px] focus:ring-2 focus:ring-[#C9A84C] focus:ring-offset-2 transition-all font-mono placeholder:text-outline/50" placeholder="000.000.000-00" type="text"/>
</div>
</div>
<!-- Telefone -->
<div class="space-y-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1">Telefone</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-[#C9A84C] transition-colors">call</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-[6px] focus:ring-2 focus:ring-[#C9A84C] focus:ring-offset-2 transition-all font-mono placeholder:text-outline/50" placeholder="(00) 00000-0000" type="text"/>
</div>
</div>
</div>
<!-- Senha -->
<div class="space-y-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1">Senha</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-[#C9A84C] transition-colors">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-[6px] focus:ring-2 focus:ring-[#C9A84C] focus:ring-offset-2 transition-all placeholder:text-outline/50" placeholder="••••••••" type="password"/>
</div>
<!-- Strength Indicator -->
<div class="mt-2 space-y-1">
<div class="flex gap-1 h-1 w-full">
<div class="flex-1 bg-[#C9A84C] rounded-full"></div>
<div class="flex-1 bg-[#C9A84C] rounded-full"></div>
<div class="flex-1 bg-surface-container-highest rounded-full"></div>
</div>
<div class="flex justify-between items-center px-1">
<span class="text-[10px] text-on-surface-variant font-medium">Força da senha: <span class="text-[#C9A84C]">Média</span></span>
</div>
</div>
</div>
<!-- Confirmar Senha -->
<div class="space-y-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1">Confirmar senha</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-[#C9A84C] transition-colors">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border-none rounded-[6px] focus:ring-2 focus:ring-[#C9A84C] focus:ring-offset-2 transition-all placeholder:text-outline/50" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full gold-gradient text-on-secondary-fixed py-4 rounded-[6px] font-bold text-sm tracking-widest uppercase shadow-lg shadow-[#C9A84C]/20 hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                            Solicitar Acesso
                        </button>
</div>
<!-- Footer Info -->
<div class="text-center space-y-4 pt-4">
<p class="text-xs text-on-surface-variant leading-relaxed">
                            Sua conta será ativada após aprovação do administrador.
                        </p>
<div class="pt-4 border-t border-surface-container-high">
<p class="text-sm text-on-surface-variant">
                                Já tem conta? 
                                <a class="text-[#C9A84C] font-semibold hover:underline decoration-2 underline-offset-4 transition-all ml-1" href="#">Entrar</a>
</p>
</div>
</div>
</form>
</div>
</section>
</main>
</body></html>
