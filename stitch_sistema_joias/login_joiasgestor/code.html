<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JoiasGestor - Login de Luxo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "inverse-on-surface": "#f0f1f1",
              "surface-dim": "#dadada",
              "inverse-primary": "#c8c6c5",
              "surface-bright": "#f9f9f9",
              "on-tertiary-container": "#4a3f19",
              "surface-container-highest": "#e2e2e2",
              "primary-fixed": "#e5e2e1",
              "on-tertiary": "#ffffff",
              "outline": "#7e7665",
              "tertiary-fixed": "#f5e1ae",
              "secondary-container": "#fed977",
              "on-background": "#1a1c1c",
              "secondary-fixed-dim": "#e6c364",
              "primary-fixed-dim": "#c8c6c5",
              "surface-tint": "#5f5e5e",
              "secondary-fixed": "#ffe08f",
              "error-container": "#ffdad6",
              "surface-container-low": "#f3f3f3",
              "outline-variant": "#d0c5b2",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "surface": "#f9f9f9",
              "secondary": "#755b00",
              "on-secondary": "#ffffff",
              "inverse-surface": "#2f3131",
              "primary": "#5f5e5e",
              "tertiary": "#6b5d35",
              "surface-variant": "#e2e2e2",
              "on-tertiary-fixed-variant": "#524620",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed-variant": "#584400",
              "primary-container": "#adabab",
              "on-tertiary-fixed": "#231b00",
              "on-surface-variant": "#4d4637",
              "on-primary-fixed": "#1c1b1b",
              "tertiary-fixed-dim": "#d8c594",
              "tertiary-container": "#bbaa7b",
              "surface-container-high": "#e8e8e8",
              "on-primary-container": "#40403f",
              "background": "#f9f9f9",
              "on-primary-fixed-variant": "#474746",
              "surface-container": "#eeeeee",
              "brand-gold": "#C9A84C",
              "brand-dark": "#1A1A1A"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"],
              "mono": ["JetBrains Mono"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .gold-luxe-gradient {
            background: linear-gradient(135deg, #755B00 0%, #E6C364 100%);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased selection:bg-brand-gold/30">
<main class="min-h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Left Side: Hero (60% on Desktop) -->
<section class="relative w-full h-[307px] md:h-screen md:w-[60%] flex-shrink-0">
<img alt="Close-up de joias de ouro e diamantes sobre veludo preto profundo" class="absolute inset-0 w-full h-full object-cover" data-alt="Exquisite close-up of gold necklaces and brilliant diamonds resting on dark black velvet with dramatic soft side lighting and luxury atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCnI15fU71_zWeZL6H8w9Jz4oLfzL5XfGXQpJIdSA-rWE7bYG5ljBkBxk3Y40LMaR2WeNNqJBksTnjZ4UW5cLAA3sfwgUquNClO3WR_v6eE7vIpCbo3aHirRLrtPTXn29Sjp9fyzoW0N5T6IIS2MWJuel2vtzKzPyn2KolSf7CFZKIJ2msqrRzDSRiRdGE7CI_Qpmlj6JVmmqDz3OcKG-HZ7ZZ0Ie-cD9WPj1b-kfvHGgYbyuqRopXGcS0-_S9QoPEScnj08MtQ7Ca"/>
<div class="absolute inset-0 bg-gradient-to-r from-brand-dark/90 via-brand-dark/40 to-transparent"></div>
<!-- Branding Overlay -->
<div class="relative z-10 h-full p-8 md:p-16 flex flex-col justify-between">
<div>
<h1 class="text-brand-gold text-2xl md:text-3xl font-bold tracking-widest uppercase mb-2">
                        JoiasGestor
                    </h1>
<p class="text-white/90 text-sm md:text-lg font-light tracking-wide max-w-xs md:max-w-md">
                        Gestão inteligente para sua joalheria
                    </p>
</div>
<div class="hidden md:block">
<p class="text-white/40 font-mono text-xs uppercase tracking-[0.2em]">
                        Edição de Alta Joalheria © 2024
                    </p>
</div>
</div>
</section>
<!-- Right Side: Login Form (40% on Desktop) -->
<section class="w-full md:w-[40%] bg-surface-container-lowest flex items-center justify-center p-8 md:p-12 lg:p-20 overflow-y-auto">
<div class="w-full max-w-md">
<!-- Form Header -->
<header class="mb-10">
<h2 class="text-4xl font-bold text-brand-dark tracking-tight mb-2">
                        Entrar
                    </h2>
<p class="text-on-surface-variant text-base">
                        Acesse sua conta para continuar
                    </p>
</header>
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="email">
                            E-mail
                        </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-brand-gold transition-colors">
                                    mail
                                </span>
</div>
<input class="w-full pl-11 pr-4 py-3.5 bg-surface border-none ring-1 ring-outline-variant/30 rounded-lg focus:ring-2 focus:ring-brand-gold focus:ring-offset-2 transition-all outline-none placeholder:text-outline/50 text-brand-dark" id="email" name="email" placeholder="seu@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant ml-1" for="password">
                            Senha
                        </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-brand-gold transition-colors">
                                    lock
                                </span>
</div>
<input class="w-full pl-11 pr-12 py-3.5 bg-surface border-none ring-1 ring-outline-variant/30 rounded-lg focus:ring-2 focus:ring-brand-gold focus:ring-offset-2 transition-all outline-none placeholder:text-outline/50 text-brand-dark" id="password" name="password" placeholder="********" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-brand-gold transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">
                                    visibility
                                </span>
</button>
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between text-sm">
<label class="flex items-center cursor-pointer group">
<input class="w-4 h-4 rounded-sm border-outline-variant text-brand-gold focus:ring-brand-gold transition-all" type="checkbox"/>
<span class="ml-2 text-on-surface-variant group-hover:text-brand-dark transition-colors">Lembrar de mim</span>
</label>
<a class="text-brand-gold font-medium hover:text-secondary transition-colors underline-offset-4 hover:underline" href="#">
                            Esqueci minha senha
                        </a>
</div>
<!-- Submit Button -->
<button class="w-full gold-luxe-gradient text-brand-dark font-bold py-4 rounded-lg shadow-lg shadow-brand-gold/10 hover:shadow-brand-gold/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>ENTRAR</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">
                            arrow_forward
                        </span>
</button>
<!-- Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest">
<span class="bg-surface-container-lowest px-4 text-outline font-medium">ou</span>
</div>
</div>
<!-- Create Account -->
<div class="text-center">
<p class="text-on-surface-variant">
                            Não possui uma conta? 
                            <a class="text-brand-gold font-bold ml-1 hover:text-secondary transition-colors decoration-2 underline-offset-4 hover:underline" href="#">
                                Criar uma conta
                            </a>
</p>
</div>
</form>
<!-- Footer Info -->
<footer class="mt-16 text-center">
<p class="text-[10px] text-outline uppercase tracking-[0.25em] font-mono">
                        Hardware Encrypted System
                    </p>
</footer>
</div>
</section>
</main>
</body></html>
